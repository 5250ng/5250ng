name: Build and Release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x64
            runner: macos-26-intel
            macos_cmake_arch: x86_64
          - os: macos
            arch: arm64
            runner: macos-26
            macos_cmake_arch: arm64
          - os: windows
            arch: x64
            runner: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ── Linux ──
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            cmake \
            g++ \
            build-essential

      - name: Configure CMake (Linux)
        if: matrix.os == 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      # ── macOS ──
      - name: Install Qt (macOS)
        if: matrix.os == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.9.2+ no longer links against AGL.framework, which was
          # removed from macOS 26. Qt 6.10 supports macOS 13 and newer.
          version: '6.10.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install build tools (macOS)
        if: matrix.os == 'macos'
        run: brew install cmake

      - name: Build OpenSSL for target arch (macOS)
        if: matrix.os == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          set -e
          OPENSSL_VERSION=3.3.2
          curl -fsSLO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          if [ "${{ matrix.macos_cmake_arch }}" = "x86_64" ]; then
            OSSL_TARGET=darwin64-x86_64-cc
          else
            OSSL_TARGET=darwin64-arm64-cc
          fi
          ./Configure "$OSSL_TARGET" --prefix="$GITHUB_WORKSPACE/openssl-install" no-shared no-tests
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw
          echo "OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl-install" >> "$GITHUB_ENV"

      - name: Configure CMake (macOS)
        if: matrix.os == 'macos'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.macos_cmake_arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"

      # ── Windows ──
      - name: Install Qt (Windows)
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install OpenSSL via vcpkg (Windows)
        if: matrix.os == 'windows'
        run: vcpkg install openssl:x64-windows

      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows'
        run: choco install innosetup --yes --no-progress

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ── Build (all platforms) ──
      - name: Build
        run: cmake --build build --config Release --target 5250ng

      # ── Package ──
      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p release
          cp build/bin/5250ng release/
          cd release && tar czf ../5250ng-linux-${{ matrix.arch }}.tar.gz *

      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail

          app=build/bin/5250ng.app
          archive=5250ng-macos-${{ matrix.arch }}.zip
          expected_arch=${{ matrix.macos_cmake_arch }}

          # macdeployqt makes the bundle self-contained and ad-hoc signs every
          # executable. Users still need to approve an unnotarized download,
          # but the bundle itself must have a valid, internally consistent
          # signature.
          macdeployqt "$app" -codesign=- -verbose=2

          lipo "$app/Contents/MacOS/5250ng" -verify_arch "$expected_arch"
          minimum_os=$(otool -l "$app/Contents/MacOS/5250ng" |
            awk '/LC_BUILD_VERSION/{build=1} build && /minos/{print $2; exit}')
          if [[ "$minimum_os" != "13.0" ]]; then
            echo "Expected macOS deployment target 13.0, found $minimum_os" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

          # AGL was removed in macOS 26. Check every Mach-O file so an older Qt
          # package cannot silently reintroduce a launch-time dependency on it.
          while IFS= read -r binary; do
            if file "$binary" | grep -q 'Mach-O' && \
               otool -L "$binary" | grep -q '/AGL.framework/'; then
              echo "Obsolete AGL dependency found in $binary" >&2
              exit 1
            fi
          done < <(find "$app" -type f)

          # ditto preserves the framework symlinks and macOS metadata. Plain
          # `zip -r` follows those symlinks and changes the signed app bundle.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"

          # Verify the exact archive users receive, not only the pre-archive
          # build directory.
          mkdir package-check
          ditto -x -k "$archive" package-check
          packaged_app=package-check/5250ng.app
          test -L "$packaged_app/Contents/Frameworks/QtCore.framework/Versions/Current"
          lipo "$packaged_app/Contents/MacOS/5250ng" -verify_arch "$expected_arch"
          codesign --verify --deep --strict --verbose=2 "$packaged_app"
          "$packaged_app/Contents/MacOS/5250ng" --version

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Create deployment directory
          mkdir deploy\5250ng
          copy build\bin\Release\5250ng.exe deploy\5250ng\
          windeployqt --release deploy\5250ng\5250ng.exe

          # Copy OpenSSL DLLs from vcpkg
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path "$vcpkgBin\libcrypto-3-x64.dll") {
            copy "$vcpkgBin\libcrypto-3-x64.dll" deploy\5250ng\
            copy "$vcpkgBin\libssl-3-x64.dll" deploy\5250ng\
          }

          # Create portable ZIP
          Compress-Archive -Path deploy\5250ng\* -DestinationPath 5250ng-windows-${{ matrix.arch }}.zip

          # Build installer with Inno Setup
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\5250ng.iss
          copy installer\Output\5250ng-setup-x64.exe 5250ng-windows-${{ matrix.arch }}-setup.exe

      # ── Upload ──
      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: 5250ng-*
          file_glob: true

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: 5250ng-${{ matrix.os }}-${{ matrix.arch }}
          path: 5250ng-*
          if-no-files-found: error
