name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x64
            runner: macos-latest
            macos_cmake_arch: x86_64
          - os: macos
            arch: arm64
            runner: macos-latest
            macos_cmake_arch: arm64
          - os: windows
            arch: x64
            runner: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Linux ──
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            cmake \
            g++ \
            build-essential

      - name: Configure CMake (Linux)
        if: matrix.os == 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # ── macOS ──
      - name: Install Qt (macOS)
        if: matrix.os == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install build tools (macOS)
        if: matrix.os == 'macos'
        run: brew install cmake

      - name: Build OpenSSL for target arch (macOS)
        if: matrix.os == 'macos'
        run: |
          set -e
          OPENSSL_VERSION=3.3.2
          curl -fsSLO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          if [ "${{ matrix.macos_cmake_arch }}" = "x86_64" ]; then
            OSSL_TARGET=darwin64-x86_64-cc
          else
            OSSL_TARGET=darwin64-arm64-cc
          fi
          ./Configure "$OSSL_TARGET" --prefix="$GITHUB_WORKSPACE/openssl-install" no-shared no-tests
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw
          echo "OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl-install" >> "$GITHUB_ENV"

      - name: Configure CMake (macOS)
        if: matrix.os == 'macos'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.macos_cmake_arch }} \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"

      # ── Windows ──
      - name: Install Qt (Windows)
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          cache: true

      - name: Install OpenSSL via vcpkg (Windows)
        if: matrix.os == 'windows'
        run: vcpkg install openssl:x64-windows

      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows'
        run: choco install innosetup --yes --no-progress

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ── Build (all platforms) ──
      - name: Build
        run: cmake --build build --config Release

      # ── Package ──
      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p release
          cp build/bin/5250ng release/
          cd release && tar czf ../5250ng-linux-${{ matrix.arch }}.tar.gz *

      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: |
          macdeployqt build/bin/5250ng.app
          mkdir -p release
          cp -R build/bin/5250ng.app release/
          cd release && zip -r ../5250ng-macos-${{ matrix.arch }}.zip 5250ng.app

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Create deployment directory
          mkdir deploy\5250ng
          copy build\bin\Release\5250ng.exe deploy\5250ng\
          windeployqt --release deploy\5250ng\5250ng.exe

          # Copy OpenSSL DLLs from vcpkg
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path "$vcpkgBin\libcrypto-3-x64.dll") {
            copy "$vcpkgBin\libcrypto-3-x64.dll" deploy\5250ng\
            copy "$vcpkgBin\libssl-3-x64.dll" deploy\5250ng\
          }

          # Create portable ZIP
          Compress-Archive -Path deploy\5250ng\* -DestinationPath 5250ng-windows-${{ matrix.arch }}.zip

          # Build installer with Inno Setup
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\5250ng.iss
          copy installer\Output\5250ng-setup-x64.exe 5250ng-windows-${{ matrix.arch }}-setup.exe

      # ── Upload ──
      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: 5250ng-*
          file_glob: true
