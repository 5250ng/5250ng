name: Build and Release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x64
            runner: macos-26-intel
            macos_cmake_arch: x86_64
          - os: macos
            arch: arm64
            runner: macos-26
            macos_cmake_arch: arm64
          - os: windows
            arch: x64
            runner: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ── Linux ──
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            cmake \
            g++ \
            build-essential

      - name: Configure CMake (Linux)
        if: matrix.os == 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      # ── macOS ──
      - name: Install Qt (macOS)
        if: matrix.os == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.9.2+ no longer links against AGL.framework, which was
          # removed from macOS 26. Qt 6.10 supports macOS 13 and newer.
          version: '6.10.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install build tools (macOS)
        if: matrix.os == 'macos'
        run: brew install cmake

      - name: Build OpenSSL for target arch (macOS)
        if: matrix.os == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          set -e
          OPENSSL_VERSION=3.5.9
          OPENSSL_SHA256=603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
          curl -fsSLO "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          printf '%s  %s\n' "$OPENSSL_SHA256" "openssl-${OPENSSL_VERSION}.tar.gz" \
            | shasum -a 256 -c -
          tar xf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          if [ "${{ matrix.macos_cmake_arch }}" = "x86_64" ]; then
            OSSL_TARGET=darwin64-x86_64-cc
          else
            OSSL_TARGET=darwin64-arm64-cc
          fi
          ./Configure "$OSSL_TARGET" --prefix="$GITHUB_WORKSPACE/openssl-install" no-shared no-tests
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw
          echo "OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl-install" >> "$GITHUB_ENV"

      - name: Configure CMake (macOS)
        if: matrix.os == 'macos'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.macos_cmake_arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"

      - name: Prepare macOS signing and notarization
        if: matrix.os == 'macos'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID_SECRET: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID_SECRET: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            CERTIFICATE_PATH="$RUNNER_TEMP/5250ng-signing.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/5250ng-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"

            printf '%s' "$MACOS_CERTIFICATE_P12" \
              | openssl base64 -d -A > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" \
              -P "$MACOS_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list \
              -S apple-tool:,apple: -s \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            SIGNING_IDENTITY="$(security find-identity -v -p codesigning \
              "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
            if [[ -z "$SIGNING_IDENTITY" ]]; then
              echo "Developer ID Application identity not found in certificate" >&2
              exit 1
            fi
            printf 'MACOS_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          else
            echo "Signing certificate not configured; release will be ad-hoc signed"
          fi

          if [[ -n "$MACOS_NOTARY_KEY_P8" ]]; then
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID_SECRET}.p8"
            printf '%s' "$MACOS_NOTARY_KEY_P8" \
              | openssl base64 -d -A > "$NOTARY_KEY_PATH"
            chmod 600 "$NOTARY_KEY_PATH"
            printf 'MACOS_NOTARY_KEY=%s\n' "$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
            printf 'MACOS_NOTARY_KEY_ID=%s\n' \
              "$MACOS_NOTARY_KEY_ID_SECRET" >> "$GITHUB_ENV"
            printf 'MACOS_NOTARY_ISSUER_ID=%s\n' \
              "$MACOS_NOTARY_ISSUER_ID_SECRET" >> "$GITHUB_ENV"
          fi

      # ── Windows ──
      - name: Install Qt (Windows)
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install OpenSSL via vcpkg (Windows)
        if: matrix.os == 'windows'
        run: vcpkg install openssl:x64-windows

      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows'
        run: choco install innosetup --yes --no-progress

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ── Build (all platforms) ──
      - name: Build
        run: cmake --build build --config Release --target 5250ng

      # ── Package ──
      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p release
          cp build/bin/5250ng release/
          cd release && tar czf ../5250ng-linux-${{ matrix.arch }}.tar.gz *

      - name: Package (macOS)
        if: matrix.os == 'macos'
        env:
          MACOS_EXPECTED_ARCH: ${{ matrix.macos_cmake_arch }}
          MACOS_EXPECTED_MIN_VERSION: '13.0'
        run: |
          scripts/package_macos.sh \
            build/bin/5250ng.app \
            5250ng-macos-${{ matrix.arch }}.dmg

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Create deployment directory
          mkdir deploy\5250ng
          copy build\bin\Release\5250ng.exe deploy\5250ng\
          windeployqt --release deploy\5250ng\5250ng.exe

          # Copy OpenSSL DLLs from vcpkg
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path "$vcpkgBin\libcrypto-3-x64.dll") {
            copy "$vcpkgBin\libcrypto-3-x64.dll" deploy\5250ng\
            copy "$vcpkgBin\libssl-3-x64.dll" deploy\5250ng\
          }

          # Create portable ZIP
          Compress-Archive -Path deploy\5250ng\* -DestinationPath 5250ng-windows-${{ matrix.arch }}.zip

          # Build installer with Inno Setup
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\5250ng.iss
          copy installer\Output\5250ng-setup-x64.exe 5250ng-windows-${{ matrix.arch }}-setup.exe

      # ── Upload ──
      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: 5250ng-*
          file_glob: true

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: 5250ng-${{ matrix.os }}-${{ matrix.arch }}
          path: 5250ng-*
          if-no-files-found: error
